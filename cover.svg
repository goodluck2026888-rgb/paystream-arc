<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="500" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="640" cy="320" r="300" fill="#ffffff" opacity="0.03"/>

  <!-- Hexagon decoration (blockchain motif) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" fill="none">
    <polygon points="950,80 1010,115 1010,185 950,220 890,185 890,115"/>
    <polygon points="1050,200 1110,235 1110,305 1050,340 990,305 990,235"/>
    <polygon points="150,420 210,455 210,525 150,560 90,525 90,455"/>
  </g>

  <!-- Overlay gradient -->
  <rect width="1280" height="640" fill="url(#overlay)"/>

  <!-- Icon (emoji rendered as text) -->
  <text x="640" y="200" font-size="100" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">💳</text>

  <!-- Title -->
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">PayStream Arc</text>

  <!-- Subtitle -->
  <text x="640" y="400" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="1">B2B Subscription Gateway</text>

  <!-- Divider line -->
  <line x1="490" y1="440" x2="790" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- Tech stack badges -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.75">
    <text x="340" y="500" text-anchor="middle">Arc L1</text>
    <text x="500" y="500" text-anchor="middle">|</text>
    <text x="580" y="500" text-anchor="middle">USDC</text>
    <text x="660" y="500" text-anchor="middle">|</text>
    <text x="740" y="500" text-anchor="middle">x402</text>
    <text x="820" y="500" text-anchor="middle">|</text>
    <text x="940" y="500" text-anchor="middle">Circle</text>
  </g>

  <!-- Track badge -->
  <rect x="500" y="540" width="280" height="44" rx="22" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="640" y="568" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="600">Agentic Economy</text>

  <!-- Bottom branding -->
  <text x="640" y="610" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="middle">Built for Arc Hackathon 2026</text>
</svg>